# Required locally and in GitHub through .pyxis/config.yaml's pinned lint check.
version: "2"
linters:
  default: standard
  enable:
    - modernize
    - unparam
issues:
  # Fixed adoption boundary, not origin/main: merging must not make the gate
  # forget which files have been brought under lint enforcement. Older untouched
  # files retain their existing debt; every changed file must be completely clean.
  new-from-rev: c8dc37ed7a2e300d1a853f1411e33fc7955ed162
  whole-files: true
  max-issues-per-linter: 0
  max-same-issues: 0
